name: "DB - Save Anonymized DB"

on:
  workflow_dispatch:
    inputs:
      deploy-env:
        description: "Environment to save anonymized db"
        required: true
        type: choice
        options:
          - Rba
          - Production
          - Development
        default: Production

jobs:
  save-anonymized-db:
    # Ephemeral GitHub Actions runner on AWS CodeBuild (Test account); the
    # project is managed by deployment/terraform/codebuild_github_runner.
    runs-on: codebuild-osh-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    environment: Test
    steps:
      - name: Get Environment Name for ${{ vars.ENV_NAME }}
        id: get_env_name
        uses: Entepotenz/change-string-case-action-min-dependencies@v1
        with:
          string: ${{ vars.ENV_NAME }}
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Dump database for ${{ github.event.inputs['deploy-env'] }}
        env:
          AWS_ACCESS_KEY_ID_PROD: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          AWS_SECRET_ACCESS_KEY_PROD: ${{ secrets.AWS_SECRET_ACCESS_KEY_RPOD }}
          AWS_DEFAULT_REGION_PROD: eu-west-1
          AWS_ACCESS_KEY_ID_TEST: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_TEST: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION_TEST: eu-west-1
          BASTION_INSTANCE_ID: ${{ secrets.RBA_BASTION_ID }}
        run: |
          ENV_NAME="${{ github.event.inputs['deploy-env'] }}"
          # Optional explicit bastion instance for Rba; the other environments
          # resolve their bastion by tag (see deployment/ssm/ssm_tunnel.sh).
          if [ "$ENV_NAME" != "Rba" ]; then
            unset BASTION_INSTANCE_ID
          fi

          # Fetch RDS master credentials from Secrets Manager in the source account.
          # Development shares the non-prod account with Test; Rba/Production use prod keys.
          case "$ENV_NAME" in
            Development)
              ENV_SLUG="development"
              export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID_TEST"
              export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY_TEST"
              export AWS_DEFAULT_REGION="$AWS_DEFAULT_REGION_TEST"
              ;;
            Rba)
              ENV_SLUG="rba"
              export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID_PROD"
              export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY_PROD"
              export AWS_DEFAULT_REGION="$AWS_DEFAULT_REGION_PROD"
              ;;
            *)
              ENV_SLUG="production"
              export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID_PROD"
              export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY_PROD"
              export AWS_DEFAULT_REGION="$AWS_DEFAULT_REGION_PROD"
              ;;
          esac

          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "oshub/${ENV_SLUG}/rds-master" \
            --query SecretString --output text)
          DB_USER=$(jq -r '.username' <<<"$SECRET_JSON")
          DB_PASS=$(jq -r '.password' <<<"$SECRET_JSON")

          # Forward localhost:5433 to the source database through its bastion
          # (SSM), using the credentials of the account that owns it.
          TUNNEL="$GITHUB_WORKSPACE/deployment/ssm/ssm_tunnel.sh"
          ENVIRONMENT="$ENV_NAME" bash "$TUNNEL" start database.service.osh.internal 5432 5433
          trap 'bash "$TUNNEL" stop 5433' EXIT

          cd ./src/anon-tools
          docker build -t dump_image -f Dockerfile.dump .
          docker run --name osh-anon-dump --network host --shm-size=2gb --rm \
              -e AWS_ACCESS_KEY_ID_PROD \
              -e AWS_SECRET_ACCESS_KEY_PROD \
              -e AWS_DEFAULT_REGION_PROD \
              -e AWS_ACCESS_KEY_ID_TEST \
              -e AWS_SECRET_ACCESS_KEY_TEST \
              -e AWS_DEFAULT_REGION_TEST \
              -e ENVIRONMENT="$ENV_NAME" \
              -e DATABASE_NAME=opensupplyhub \
              -e DATABASE_USERNAME="$DB_USER" \
              -e DATABASE_PASSWORD="$DB_PASS" \
              dump_image
      - name: Close the database tunnel
        # Also runs when the workflow is cancelled or a step fails, so the
        # container stops and the SSM session is terminated in AWS.
        if: always()
        env:
          AWS_ACCESS_KEY_ID_PROD: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          AWS_SECRET_ACCESS_KEY_PROD: ${{ secrets.AWS_SECRET_ACCESS_KEY_RPOD }}
          AWS_ACCESS_KEY_ID_TEST: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_TEST: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-1
        run: |
          docker rm -f osh-anon-dump >/dev/null 2>&1 || true
          # The session lives in the account of the source environment.
          if [ "${{ github.event.inputs['deploy-env'] }}" = "Development" ]; then
            export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID_TEST" AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY_TEST"
          else
            export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID_PROD" AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY_PROD"
          fi
          bash "$GITHUB_WORKSPACE/deployment/ssm/ssm_tunnel.sh" stop 5433
