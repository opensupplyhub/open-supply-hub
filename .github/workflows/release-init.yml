name: '[Release] Init'

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Release version (e.g. 1.8)'
        required: true
        type: string

# GITHUB_TOKEN cannot start other workflows via push/create events (loop
# prevention). Branch creation therefore does not trigger Deploy to AWS;
# the second job dispatches it explicitly (workflow_dispatch is allowed).
permissions:
  contents: write
  actions: write

jobs:
  create-release-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create release branch
        uses: peterjgrainger/action-create-branch@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: releases/v.${{ inputs.release-version }}
          sha: ${{ github.sha }}

  trigger-deploy-to-aws:
    runs-on: ubuntu-latest
    needs: create-release-branch
    steps:
      - name: Trigger Deploy to AWS workflow
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/opensupplyhub/open-supply-hub/actions/workflows/deploy_to_aws.yml/dispatches \
            -d '{"ref": "releases/v.${{ inputs.release-version }}", "inputs": {"deploy-env": "Pre-prod"}}'
