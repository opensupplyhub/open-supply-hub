name: '[Release] Init'

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Release version (e.g. 1.8)'
        required: true
        type: string

jobs:
  create-release-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Create release branch
        uses: peterjgrainger/action-create-branch@v4.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: releases/v.${{ inputs.release-version }}
          sha: ${{ github.sha }}
