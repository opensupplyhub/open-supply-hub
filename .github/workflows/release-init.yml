name: '[Release] Init'

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Release version (e.g. 1.8)'
        required: true
        type: string

# Create the release branch only. Do not start Deploy to AWS: Pre-prod is
# deployed later by hand (RELEASE-PROTOCOL.md). GITHUB_TOKEN pushes also
# do not fire on.push, so this job cannot accidentally start that workflow.
permissions:
  contents: write

jobs:
  create-release-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create release branch
        uses: peterjgrainger/action-create-branch@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: releases/v.${{ inputs.release-version }}
          sha: ${{ github.sha }}
