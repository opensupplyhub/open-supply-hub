name: "DB - Copy Anonymized Snapshot to Dumps Bucket (Test)"

# One-off: the snapshot is already anonymized by the weekly anonymizer
# (Production account), and a shared copy is visible to the Test account.
# This workflow copies that shared snapshot into the Test account, restores
# it to a temporary instance in the Test VPC, dumps it through the Test
# bastion, uploads the dump to oshub-dumps-anonymized and deletes the
# temporary copies. The Production master password is read only to log in
# to the copy, as db_save_anonymized.yml does.

on:
  push:
    branches:
      - OSDEV-3706-restore-missing-september-1-and-october-1-2026-monthly-bulk-data-downloads   # your branch name; remove after the first run
  workflow_dispatch:
    inputs:
      source-snapshot:
        description: "Shared anonymized snapshot ARN (Production account, shared with Test)"
        required: true
        type: string
        default: "arn:aws:rds:eu-west-1:249322298638:snapshot:opensupplyhub-enc-prd-2026-10-02-04-04-anonymized-shared"
      dump-key:
        description: "Key of the dump in oshub-dumps-anonymized"
        required: true
        type: string
        default: "osh_prod_snapshot_20261002_anon.dump"

env:
  DUMP_BUCKET: oshub-dumps-anonymized
  DB_NAME: opensupplyhub
  TEST_DB_IDENTIFIER: opensupplyhub-enc-tst
  TEMP_CLASS: db.t3.2xlarge
  COPY_SNAPSHOT_ID: anon-copy-${{ github.run_id }}
  TEMP_INSTANCE_ID: anon-restore-${{ github.run_id }}
  # Push runs have no inputs, so fall back to the same values as the defaults.
  SOURCE_SNAPSHOT: ${{ inputs.source-snapshot || 'arn:aws:rds:eu-west-1:249322298638:snapshot:opensupplyhub-enc-prd-2026-10-02-04-04-anonymized-shared' }}
  DUMP_KEY: ${{ inputs.dump-key || 'osh_prod_snapshot_20261002_anon.dump' }}

jobs:
  copy-snapshot-to-dump:
    # Same ephemeral CodeBuild runner and Test environment (secrets) as
    # db_save_anonymized.yml.
    runs-on: codebuild-osh-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    environment: Test
    timeout-minutes: 300
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Copy the shared snapshot into the Test account
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-1
        run: |
          set -euo pipefail
          : "${SOURCE_SNAPSHOT:?source snapshot is empty}"
          echo "Source snapshot: $SOURCE_SNAPSHOT"

          KMS_KEY=$(aws secretsmanager get-secret-value \
            --secret-id "oshub/test/anonymized-database-kms-key-id" \
            --query SecretString --output text)

          aws rds copy-db-snapshot \
            --source-db-snapshot-identifier "$SOURCE_SNAPSHOT" \
            --target-db-snapshot-identifier "$COPY_SNAPSHOT_ID" \
            --kms-key-id "$KMS_KEY" \
            --copy-tags \
            --output text

          for attempt in $(seq 1 120); do
            STATUS=$(aws rds describe-db-snapshots \
              --db-snapshot-identifier "$COPY_SNAPSHOT_ID" \
              --query 'DBSnapshots[0].Status' --output text)
            echo "[$attempt] $COPY_SNAPSHOT_ID status: $STATUS"
            if [ "$STATUS" = "available" ]; then
              exit 0
            fi
            sleep 60
          done
          echo "Snapshot copy was not available after 120 minutes" >&2
          exit 1

      - name: Restore the copy into a temporary instance (Test account)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-1
        run: |
          set -euo pipefail

          # Same subnet group and security groups as the Test database, so the
          # temporary copy is reachable through the Test bastion.
          SUBNET_GROUP=$(aws rds describe-db-instances \
            --db-instance-identifier "$TEST_DB_IDENTIFIER" \
            --query 'DBInstances[0].DBSubnetGroup.DBSubnetGroupName' --output text)
          SG_IDS=$(aws rds describe-db-instances \
            --db-instance-identifier "$TEST_DB_IDENTIFIER" \
            --query 'DBInstances[0].VpcSecurityGroups[].VpcSecurityGroupId' --output text)
          echo "Subnet group: $SUBNET_GROUP"

          aws rds restore-db-instance-from-db-snapshot \
            --db-instance-identifier "$TEMP_INSTANCE_ID" \
            --db-snapshot-identifier "$COPY_SNAPSHOT_ID" \
            --db-instance-class "$TEMP_CLASS" \
            --db-subnet-group-name "$SUBNET_GROUP" \
            --vpc-security-group-ids $SG_IDS \
            --no-multi-az \
            --no-publicly-accessible \
            --no-auto-minor-version-upgrade \
            --no-deletion-protection \
            --output text

      - name: Wait for the temporary instance to be available
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-1
        run: |
          set -uo pipefail
          for attempt in $(seq 1 180); do
            STATUS=$(aws rds describe-db-instances \
              --db-instance-identifier "$TEMP_INSTANCE_ID" \
              --query 'DBInstances[0].DBInstanceStatus' --output text)
            echo "[$attempt] $TEMP_INSTANCE_ID status: $STATUS"
            case "$STATUS" in
              available) exit 0 ;;
              failed | incompatible-* | storage-full | inaccessible-encryption-credentials*)
                echo "Temporary instance is in state $STATUS" >&2
                exit 1 ;;
            esac
            sleep 60
          done
          echo "Temporary instance was not available after 180 minutes" >&2
          exit 1

      - name: Open the tunnel to the temporary instance (Test bastion)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-1
          ENVIRONMENT: Test
        run: |
          set -euo pipefail
          ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier "$TEMP_INSTANCE_ID" \
            --query 'DBInstances[0].Endpoint.Address' --output text)
          echo "TEMP_ENDPOINT=$ENDPOINT" >> "$GITHUB_ENV"
          bash deployment/ssm/ssm_tunnel.sh start "$ENDPOINT" 5432 5433

      - name: Dump the anonymized copy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_RPOD }}
          AWS_DEFAULT_REGION: eu-west-1
        run: |
          set -euo pipefail
          # Login uses the master credentials the snapshot was taken with.
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "oshub/production/rds-master" \
            --query SecretString --output text)
          DB_USER=$(jq -r '.username' <<<"$SECRET_JSON")
          DB_PASS=$(jq -r '.password' <<<"$SECRET_JSON")

          mkdir -p "$RUNNER_TEMP/dumps"
          docker run --rm --network host \
            -e PGPASSWORD="$DB_PASS" \
            -v "$RUNNER_TEMP/dumps:/dumps" \
            postgis/postgis:16-3.4-alpine \
            pg_dump --clean --no-owner --no-privileges -Fc \
              -h localhost -p 5433 -U "$DB_USER" -d "$DB_NAME" \
              -f /dumps/anonymized.dump -w --verbose

          # Fail here, not in the restore, if the file is not a valid dump.
          docker run --rm -v "$RUNNER_TEMP/dumps:/dumps:ro" \
            postgis/postgis:16-3.4-alpine \
            pg_restore -l /dumps/anonymized.dump > /dev/null
          ls -la "$RUNNER_TEMP/dumps"

      - name: Upload the dump to the dumps bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-1
        run: |
          set -euo pipefail
          aws s3 cp --only-show-errors "$RUNNER_TEMP/dumps/anonymized.dump" \
            "s3://${DUMP_BUCKET}/${DUMP_KEY}"
          echo "Uploaded s3://${DUMP_BUCKET}/${DUMP_KEY}"
          rm -f "$RUNNER_TEMP/dumps/anonymized.dump"

      - name: Close the tunnel
        # Runs when the workflow is cancelled or a step fails.
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-1
        run: bash "$GITHUB_WORKSPACE/deployment/ssm/ssm_tunnel.sh" stop 5433

      - name: Delete the temporary instance and the copied snapshot (Test account)
        # Runs even if an earlier step failed, so no copy is left behind.
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-1
        run: |
          aws rds delete-db-instance \
            --db-instance-identifier "$TEMP_INSTANCE_ID" \
            --skip-final-snapshot --delete-automated-backups \
            --output text || echo "No temporary instance to delete"
          aws rds delete-db-snapshot \
            --db-snapshot-identifier "$COPY_SNAPSHOT_ID" \
            --output text || echo "No copied snapshot to delete"
