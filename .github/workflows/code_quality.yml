name: Code Quality

on:
  pull_request:
    types: [synchronize, opened, reopened]

jobs:
  # Path filters: skip jobs whose trees did not change. Job-level `if` (not
  # workflow `paths`) so the workflow always reports and required checks are
  # not left pending. `critical` is the always-run allowlist.
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.critical == 'true' }}
      frontend_lint: ${{ steps.filter.outputs.frontend_lint == 'true' || steps.filter.outputs.critical == 'true' }}
      django: ${{ steps.filter.outputs.django == 'true' || steps.filter.outputs.critical == 'true' }}
      django_lint: ${{ steps.filter.outputs.django_lint == 'true' || steps.filter.outputs.critical == 'true' }}
      countries: ${{ steps.filter.outputs.countries == 'true' || steps.filter.outputs.critical == 'true' }}
      contricleaner: ${{ steps.filter.outputs.contricleaner == 'true' || steps.filter.outputs.critical == 'true' }}
      dedupe: ${{ steps.filter.outputs.dedupe == 'true' || steps.filter.outputs.critical == 'true' }}
      contribot: ${{ steps.filter.outputs.contribot == 'true' || steps.filter.outputs.critical == 'true' }}
      integration: ${{ steps.filter.outputs.integration == 'true' || steps.filter.outputs.critical == 'true' }}
      scripts: ${{ steps.filter.outputs.scripts == 'true' || steps.filter.outputs.critical == 'true' }}
    steps:
      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            critical:
              - '.github/workflows/code_quality.yml'
            frontend:
              - 'src/react/**'
              - 'docker-compose.yml'
            frontend_lint:
              - 'src/react/**'
            django:
              - 'src/django/api/**'
              - 'src/django/oar/**'
              - 'src/django/ckeditor/**'
              - 'src/django/web/**'
              - 'src/django/static/**'
              - 'src/django/sqls/**'
              - 'src/django/Dockerfile'
              - 'src/django/manage.py'
              - 'src/django/requirements.txt'
              - 'docker-compose.yml'
            django_lint:
              - 'src/django/**'
              - '!src/django/manage.py'
              - '!src/django/**/settings.py'
              - '!src/django/api/migrations/**'
            countries:
              - 'src/django/countries/**'
              - 'src/django/oar/**'
              - 'src/django/Dockerfile'
              - 'src/django/manage.py'
              - 'src/django/requirements.txt'
              - 'docker-compose.yml'
            contricleaner:
              - 'src/django/contricleaner/**'
              - 'src/django/oar/**'
              - 'src/django/Dockerfile'
              - 'src/django/manage.py'
              - 'src/django/requirements.txt'
              - 'docker-compose.yml'
            dedupe:
              - 'src/dedupe-hub/**'
              - 'docker-compose.yml'
            contribot:
              - 'src/contribot/**'
            integration:
              - 'src/react/**'
              - 'src/django/**'
              - 'src/dedupe-hub/**'
              - 'src/database/**'
              - 'src/logstash/**'
              - 'src/tests/**'
              - 'src/e2e/**'
              - 'src/batch/**'
              - 'src/anon-tools/**'
              - 'src/kafka-tools/**'
              - 'src/maintenance-page/**'
              - 'docker-compose.yml'
              - 'docker-compose.tests.yml'
              - 'scripts/start_code_quality_dev'
              - 'scripts/update'
              - 'scripts/reset_database'
              - 'scripts/manage'
            scripts:
              - 'scripts/**'

      - name: Path filter results
        env:
          CRITICAL: ${{ steps.filter.outputs.critical }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          FRONTEND_LINT: ${{ steps.filter.outputs.frontend_lint }}
          DJANGO: ${{ steps.filter.outputs.django }}
          DJANGO_LINT: ${{ steps.filter.outputs.django_lint }}
          COUNTRIES: ${{ steps.filter.outputs.countries }}
          CONTRICLEANER: ${{ steps.filter.outputs.contricleaner }}
          DEDUPE: ${{ steps.filter.outputs.dedupe }}
          CONTRIBOT: ${{ steps.filter.outputs.contribot }}
          INTEGRATION: ${{ steps.filter.outputs.integration }}
          SCRIPTS: ${{ steps.filter.outputs.scripts }}
        run: |
          echo "critical=${CRITICAL}"
          echo "frontend=${FRONTEND}"
          echo "frontend_lint=${FRONTEND_LINT}"
          echo "django=${DJANGO}"
          echo "django_lint=${DJANGO_LINT}"
          echo "countries=${COUNTRIES}"
          echo "contricleaner=${CONTRICLEANER}"
          echo "dedupe=${DEDUPE}"
          echo "contribot=${CONTRIBOT}"
          echo "integration=${INTEGRATION}"
          echo "scripts=${SCRIPTS}"

  # code quality for the frontend
  get-base-branch-fe-cov:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: Quality Environment
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
      - name: Create required env file
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Run the Jest tests and generate code cov report
        run: docker compose run --rm --no-deps react yarn test
      - name: Upload Jest code cov for the base branch
        uses: actions/upload-artifact@v4
        with:
          name: base-branch-fe-jest-code-cov
          path: ./src/react/coverage/lcov.info

  run-fe-code-quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create required env file
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Run the Jest tests and generate code cov report
        run: docker compose run --rm --no-deps react yarn test
      - name: Upload Jest code cov for the feature branch
        uses: actions/upload-artifact@v4
        with:
          name: feature-branch-fe-jest-code-cov
          path: ./src/react/coverage/lcov.info

  check-fe-code-cov:
    needs:
      - detect-changes
      - get-base-branch-fe-cov
      - run-fe-code-quality
    if: needs.detect-changes.outputs.frontend == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Download Jest code cov reports
        uses: actions/download-artifact@v4
        with:
          pattern: "*-jest-code-cov"
      - name: Verify Jest code cov
        uses: barecheck/code-coverage-action@v1
        with:
          barecheck-github-app-token: ${{ secrets.BARECHECK_GITHUB_APP_TOKEN }}
          lcov-file: "./feature-branch-fe-jest-code-cov/lcov.info"
          base-lcov-file: "./base-branch-fe-jest-code-cov/lcov.info"
          minimum-ratio: 1
          send-summary-comment: true
          show-annotations: "warning"
          app-name: React App | Jest test suite

  # code quality for the Django app
  get-base-branch-django-cov:
    needs: detect-changes
    if: needs.detect-changes.outputs.django == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
      - name: Create required env file
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Build Django image
        run: docker compose build
      - name: Run the unittest tests and generate code cov report
        run: |
          docker compose \
            run --rm --entrypoint /bin/sh django \
            -c "coverage run --data-file=./coverage/django/.coverage manage.py test --no-input ./api/tests \
            && coverage lcov --data-file=./coverage/django/.coverage -o ./coverage/django/coverage.lcov \
            --include='./api/*' --omit='./api/migrations/*,./api/tests/*'"
      - name: Upload unittest code cov for the base branch
        uses: actions/upload-artifact@v4
        with:
          name: base-branch-django-unittest-code-cov
          path: ./src/django/coverage/django/coverage.lcov

  run-django-code-quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.django == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create required env file
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Build Django image
        run: docker compose build
      - name: Run the unittest tests and generate code cov report
        run: |
          docker compose \
            run --rm --entrypoint /bin/sh django \
            -c "coverage run --data-file=./coverage/django/.coverage manage.py test --no-input ./api/tests \
            && coverage lcov --data-file=./coverage/django/.coverage -o ./coverage/django/coverage.lcov \
            --include='./api/*' --omit='./api/migrations/*,./api/tests/*'"
      - name: Upload unittest code cov for the feature branch
        uses: actions/upload-artifact@v4
        with:
          name: feature-branch-django-unittest-code-cov
          path: ./src/django/coverage/django/coverage.lcov

  check-django-code-cov:
    needs:
      - detect-changes
      - get-base-branch-django-cov
      - run-django-code-quality
    if: needs.detect-changes.outputs.django == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Download unittest code cov reports
        uses: actions/download-artifact@v4
        with:
          pattern: "*-unittest-code-cov"
      - name: Verify unittest code cov
        uses: barecheck/code-coverage-action@v1
        with:
          barecheck-github-app-token: ${{ secrets.BARECHECK_GITHUB_APP_TOKEN }}
          lcov-file: "./feature-branch-django-unittest-code-cov/coverage.lcov"
          base-lcov-file: "./base-branch-django-unittest-code-cov/coverage.lcov"
          minimum-ratio: 1
          send-summary-comment: true
          show-annotations: "warning"
          app-name: Django App | Unittest test suite

  # code quality for the Countries
  get-base-branch-countries-cov:
    needs: detect-changes
    if: needs.detect-changes.outputs.countries == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
      - name: Create required env file
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Build Django image
        run: docker compose build
      - name: Run the unittest tests and generate code cov report
        run: |
          docker compose \
              run --rm --entrypoint /bin/sh django \
              -c "coverage run --data-file=./coverage/countries/.coverage manage.py test --no-input ./countries/tests \
              && coverage lcov --data-file=./coverage/countries/.coverage -o ./coverage/countries/coverage.lcov \
              --include='./countries/*' --omit='./countries/tests/*'"
      - name: Upload unittest code cov for the base branch
        uses: actions/upload-artifact@v4
        with:
          name: base-branch-countries-unittest-code-cov
          path: ./src/django/coverage/countries/coverage.lcov

  run-countries-code-quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.countries == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create required env file
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Build Django image
        run: docker compose build
      - name: Run the unittest tests and generate code cov report
        run: |
          docker compose \
              run --rm --entrypoint /bin/sh django \
              -c "coverage run --data-file=./coverage/countries/.coverage manage.py test --no-input ./countries/tests \
              && coverage lcov --data-file=./coverage/countries/.coverage -o ./coverage/countries/coverage.lcov \
              --include='./countries/*' --omit='./countries/tests/*'"
      - name: Upload unittest code cov for the feature branch
        uses: actions/upload-artifact@v4
        with:
          name: feature-branch-countries-unittest-code-cov
          path: ./src/django/coverage/countries/coverage.lcov

  check-countries-code-cov:
    needs:
      - detect-changes
      - get-base-branch-countries-cov
      - run-countries-code-quality
    if: needs.detect-changes.outputs.countries == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Download unittest code cov reports
        uses: actions/download-artifact@v4
        with:
          pattern: "*-unittest-code-cov"
      - name: Verify unittest code cov
        uses: barecheck/code-coverage-action@v1
        with:
          barecheck-github-app-token: ${{ secrets.BARECHECK_GITHUB_APP_TOKEN }}
          lcov-file: "./feature-branch-countries-unittest-code-cov/coverage.lcov"
          base-lcov-file: "./base-branch-countries-unittest-code-cov/coverage.lcov"
          minimum-ratio: 1
          send-summary-comment: true
          show-annotations: "warning"
          app-name: Countries App | Unittest test suite

  # code quality for the Contricleaner
  get-base-branch-contricleaner-cov:
    needs: detect-changes
    if: needs.detect-changes.outputs.contricleaner == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
      - name: Create required env file
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Build Django image
        run: docker compose build
      - name: Run the unittest tests and generate code cov report
        run: |
          docker compose \
              run --rm --entrypoint /bin/sh django \
              -c "coverage run --data-file=./coverage/contricleaner/.coverage manage.py test --no-input ./contricleaner/tests \
              && coverage lcov --data-file=./coverage/contricleaner/.coverage -o ./coverage/contricleaner/coverage.lcov \
              --include='./contricleaner/*' --omit='./contricleaner/tests/*'"
      - name: Upload unittest code cov for the base branch
        uses: actions/upload-artifact@v4
        with:
          name: base-branch-contricleaner-unittest-code-cov
          path: ./src/django/coverage/contricleaner/coverage.lcov

  run-contricleaner-code-quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.contricleaner == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create required env file
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Build Django image
        run: docker compose build
      - name: Run the unittest tests and generate code cov report
        run: |
          docker compose \
              run --rm --entrypoint /bin/sh django \
              -c "coverage run --data-file=./coverage/contricleaner/.coverage manage.py test --no-input ./contricleaner/tests \
              && coverage lcov --data-file=./coverage/contricleaner/.coverage -o ./coverage/contricleaner/coverage.lcov \
              --include='./contricleaner/*' --omit='./contricleaner/tests/*'"
      - name: Upload unittest code cov for the feature branch
        uses: actions/upload-artifact@v4
        with:
          name: feature-branch-contricleaner-unittest-code-cov
          path: ./src/django/coverage/contricleaner/coverage.lcov

  check-contricleaner-code-cov:
    needs:
      - detect-changes
      - get-base-branch-contricleaner-cov
      - run-contricleaner-code-quality
    if: needs.detect-changes.outputs.contricleaner == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Download unittest code cov reports
        uses: actions/download-artifact@v4
        with:
          pattern: "*-unittest-code-cov"
      - name: Verify unittest code cov
        uses: barecheck/code-coverage-action@v1
        with:
          barecheck-github-app-token: ${{ secrets.BARECHECK_GITHUB_APP_TOKEN }}
          lcov-file: "./feature-branch-contricleaner-unittest-code-cov/coverage.lcov"
          base-lcov-file: "./base-branch-contricleaner-unittest-code-cov/coverage.lcov"
          minimum-ratio: 1
          send-summary-comment: true
          show-annotations: "warning"
          app-name: Contricleaner App | Unittest test suite

  # code quality for the Dedupe Hub
  get-base-branch-dd-cov:
    needs: detect-changes
    if: needs.detect-changes.outputs.dedupe == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
      - name: Create required env file
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Build Dedupe Hub image
        run: docker compose build
      - name: Run the unittest tests and generate code cov report
        run: |
          docker compose \
              run --rm --entrypoint /bin/sh api-app \
              -c "coverage run --source=app --data-file=./coverage/.coverage -m unittest \
              && coverage lcov --data-file=./coverage/.coverage -o ./coverage/coverage.lcov \
              --include='./app/*' --omit='./tests/*, ./app/config.py'"
      - name: Upload unittest code cov for the base branch
        uses: actions/upload-artifact@v4
        with:
          name: base-branch-dd-unittest-code-cov
          path: ./src/dedupe-hub/api/coverage/coverage.lcov

  run-dd-code-quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.dedupe == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create required env file
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Build Dedupe Hub image
        run: docker compose build
      - name: Run the unittest tests and generate code cov report
        run: |
          docker compose \
              run --rm --entrypoint /bin/sh api-app \
              -c "coverage run --source=app --data-file=./coverage/.coverage -m unittest \
              && coverage lcov --data-file=./coverage/.coverage -o ./coverage/coverage.lcov \
              --include='./app/*' --omit='./tests/*, ./app/config.py'"
      - name: Upload unittest code cov for the feature branch
        uses: actions/upload-artifact@v4
        with:
          name: feature-branch-dd-unittest-code-cov
          path: ./src/dedupe-hub/api/coverage/coverage.lcov

  check-dd-code-cov:
    needs:
      - detect-changes
      - get-base-branch-dd-cov
      - run-dd-code-quality
    if: needs.detect-changes.outputs.dedupe == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Download unittest code cov reports
        uses: actions/download-artifact@v4
        with:
          pattern: "*-unittest-code-cov"
      - name: Verify unittest code cov
        uses: barecheck/code-coverage-action@v1
        with:
          barecheck-github-app-token: ${{ secrets.BARECHECK_GITHUB_APP_TOKEN }}
          lcov-file: "./feature-branch-dd-unittest-code-cov/coverage.lcov"
          base-lcov-file: "./base-branch-dd-unittest-code-cov/coverage.lcov"
          minimum-ratio: 1
          send-summary-comment: true
          show-annotations: "warning"
          app-name: Dedupe Hub App | Unittest test suite

  # code quality for ContriBot
  run-contribot-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.contribot == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ContriBot test dependencies
        run: |
          pip install --require-hashes --only-binary=:all: -r src/contribot/requirements-dev.txt
      - name: Run ContriBot unit tests
        run: |
          for testdir in src/contribot/*/tests; do
            (cd "$(dirname "$testdir")" && python -m pytest tests/)
          done

  # code quality integration test
  run-integration-test-code-quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.integration == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create required env file
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Build & Run OS Hub
        run: scripts/start_code_quality_dev
      - name: Waiting for all OS Hub services live processes completed
        run: sleep 60
      - name: Build Integration Test image
        run: docker compose -f docker-compose.tests.yml build
      - name: Run Integration Test
        run: |
          docker compose -f docker-compose.tests.yml \
              run --rm --entrypoint /bin/sh integration-test \
              -c "python -m unittest"
      - name: Run Playwright Test
        run: |
          docker compose -f docker-compose.tests.yml run --rm --build \
              --entrypoint "npx playwright test -c playwright.config.ts" \
              playwright-test

  # code quality formatting
  run-bash-script-linter:
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run the shellcheck linter check
        run: shellcheck scripts/*

  run-flake8-linter:
    needs: detect-changes
    if: needs.detect-changes.outputs.django_lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flake8
        run: pip install $(grep -E '^(flake8|mccabe|pycodestyle|pyflakes)==' src/django/requirements.txt)
      - name: Run the Flake8 linter check
        working-directory: src/django
        run: flake8 --exclude 'settings.py,manage.py,*.pyc,api/migrations/*'

  run-eslint-linter-and-prettier-formatter:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: src/react/yarn.lock
      - name: Install frontend dependencies
        working-directory: src/react
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Run the ESLint linter check
        working-directory: src/react
        run: ./node_modules/.bin/eslint src/ --ext .js --ext .jsx
      - name: Run the Prettier formatting check
        working-directory: src/react
        run: |
          yarn prettier \
            --config .prettierrc \
            --check 'src/**/*.js' 'src/**/*.jsx'
