name: Code Quality

on:
  pull_request:
    types: [synchronize, opened, reopened]

jobs:
  # Path filters: skip jobs whose trees did not change. Job-level `if` (not
  # workflow `paths`) so the workflow always reports and required checks are
  # not left pending. `critical` is the always-run allowlist.
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.critical == 'true' }}
      frontend_lint: ${{ steps.filter.outputs.frontend_lint == 'true' || steps.filter.outputs.critical == 'true' }}
      django: ${{ steps.filter.outputs.django == 'true' || steps.filter.outputs.critical == 'true' }}
      django_lint: ${{ steps.filter.outputs.django_lint == 'true' || steps.filter.outputs.critical == 'true' }}
      countries: ${{ steps.filter.outputs.countries == 'true' || steps.filter.outputs.critical == 'true' }}
      contricleaner: ${{ steps.filter.outputs.contricleaner == 'true' || steps.filter.outputs.critical == 'true' }}
      dedupe: ${{ steps.filter.outputs.dedupe == 'true' || steps.filter.outputs.critical == 'true' }}
      contribot: ${{ steps.filter.outputs.contribot == 'true' || steps.filter.outputs.critical == 'true' }}
      integration: ${{ steps.filter.outputs.integration == 'true' || steps.filter.outputs.critical == 'true' }}
      scripts: ${{ steps.filter.outputs.scripts == 'true' || steps.filter.outputs.critical == 'true' }}
      terraform: ${{ steps.filter.outputs.terraform == 'true' || steps.filter.outputs.critical == 'true' }}
      workflows: ${{ steps.filter.outputs.workflows == 'true' || steps.filter.outputs.critical == 'true' }}
      ops_scripts: ${{ steps.filter.outputs.ops_scripts == 'true' || steps.filter.outputs.critical == 'true' }}
      django_models: ${{ steps.filter.outputs.django_models == 'true' || steps.filter.outputs.critical == 'true' }}
      django_migrations: ${{ steps.filter.outputs.django_migrations == 'true' || steps.filter.outputs.critical == 'true' }}
    steps:
      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            critical:
              - '.github/workflows/code_quality.yml'
            frontend:
              - 'src/react/**'
              - 'docker-compose.yml'
            frontend_lint:
              - 'src/react/**'
            django:
              - 'src/django/api/**'
              - 'src/django/oar/**'
              - 'src/django/ckeditor/**'
              - 'src/django/web/**'
              - 'src/django/sqls/**'
              - 'src/django/Dockerfile'
              - 'src/django/manage.py'
              - 'src/django/requirements.txt'
              - 'docker-compose.yml'
            django_lint:
              - 'src/django/**'
              - '!src/django/manage.py'
              - '!src/django/**/settings.py'
              - '!src/django/api/migrations/**'
            countries:
              - 'src/django/countries/**'
              - 'src/django/Dockerfile'
              - 'src/django/requirements.txt'
              - 'docker-compose.yml'
            contricleaner:
              - 'src/django/contricleaner/**'
              - 'src/django/Dockerfile'
              - 'src/django/requirements.txt'
              - 'docker-compose.yml'
            dedupe:
              - 'src/dedupe-hub/**'
              - 'docker-compose.yml'
            contribot:
              - 'src/contribot/**'
              - 'deployment/terraform/lambda-functions/contribot_*/**'
            integration:
              - 'src/react/**'
              - 'src/django/**'
              - 'src/dedupe-hub/**'
              - 'src/database/**'
              - 'src/logstash/**'
              - 'src/tests/**'
              - 'src/e2e/**'
              - 'docker-compose.yml'
              - 'docker-compose.tests.yml'
              - 'scripts/start_code_quality_dev'
              - 'scripts/update'
              - 'scripts/reset_database'
              - 'scripts/manage'
            scripts:
              - 'scripts/**'
            terraform:
              - 'deployment/**/*.tf'
              - 'deployment/**/*.tfvars'
            workflows:
              - '.github/workflows/**'
            ops_scripts:
              - 'deployment/*'
              - 'src/kafka-tools/**'
              - 'src/anon-tools/**'
            django_models:
              - 'src/django/**'
            django_migrations:
              - 'src/django/*/migrations/**'

      - name: Path filter results
        env:
          CRITICAL: ${{ steps.filter.outputs.critical }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          FRONTEND_LINT: ${{ steps.filter.outputs.frontend_lint }}
          DJANGO: ${{ steps.filter.outputs.django }}
          DJANGO_LINT: ${{ steps.filter.outputs.django_lint }}
          COUNTRIES: ${{ steps.filter.outputs.countries }}
          CONTRICLEANER: ${{ steps.filter.outputs.contricleaner }}
          DEDUPE: ${{ steps.filter.outputs.dedupe }}
          CONTRIBOT: ${{ steps.filter.outputs.contribot }}
          INTEGRATION: ${{ steps.filter.outputs.integration }}
          SCRIPTS: ${{ steps.filter.outputs.scripts }}
          TERRAFORM: ${{ steps.filter.outputs.terraform }}
          WORKFLOWS: ${{ steps.filter.outputs.workflows }}
          OPS_SCRIPTS: ${{ steps.filter.outputs.ops_scripts }}
          DJANGO_MODELS: ${{ steps.filter.outputs.django_models }}
          DJANGO_MIGRATIONS: ${{ steps.filter.outputs.django_migrations }}
        run: |
          echo "critical=${CRITICAL}"
          echo "frontend=${FRONTEND}"
          echo "frontend_lint=${FRONTEND_LINT}"
          echo "django=${DJANGO}"
          echo "django_lint=${DJANGO_LINT}"
          echo "countries=${COUNTRIES}"
          echo "contricleaner=${CONTRICLEANER}"
          echo "dedupe=${DEDUPE}"
          echo "contribot=${CONTRIBOT}"
          echo "integration=${INTEGRATION}"
          echo "scripts=${SCRIPTS}"
          echo "terraform=${TERRAFORM}"
          echo "workflows=${WORKFLOWS}"
          echo "ops_scripts=${OPS_SCRIPTS}"
          echo "django_models=${DJANGO_MODELS}"
          echo "django_migrations=${DJANGO_MIGRATIONS}"

  # code quality for the frontend
  get-base-branch-fe-cov:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: Quality Environment
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
      # The base branch's coverage depends only on its commit, so it is
      # cached by SHA. base_coverage.yml warms the cache on every push
      # to a base branch; a miss (new base push racing this job, or an
      # evicted entry) falls back to running the suite here.
      - name: Get base commit SHA
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore cached base coverage
        id: cov-cache
        uses: actions/cache@v4
        with:
          path: ./src/react/coverage/lcov.info
          key: base-fe-jest-cov-${{ steps.base.outputs.sha }}
      - name: Create required env file
        if: steps.cov-cache.outputs.cache-hit != 'true'
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Run the Jest tests and generate code cov report
        if: steps.cov-cache.outputs.cache-hit != 'true'
        run: docker compose run --rm --no-deps react yarn test
      - name: Upload Jest code cov for the base branch
        uses: actions/upload-artifact@v4
        with:
          name: base-branch-fe-jest-code-cov
          path: ./src/react/coverage/lcov.info

  run-fe-code-quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create required env file
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Run the Jest tests and generate code cov report
        run: docker compose run --rm --no-deps react yarn test
      - name: Upload Jest code cov for the feature branch
        uses: actions/upload-artifact@v4
        with:
          name: feature-branch-fe-jest-code-cov
          path: ./src/react/coverage/lcov.info

  check-fe-code-cov:
    needs:
      - detect-changes
      - get-base-branch-fe-cov
      - run-fe-code-quality
    if: needs.detect-changes.outputs.frontend == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Download Jest code cov reports
        uses: actions/download-artifact@v4
        with:
          pattern: "*-jest-code-cov"
      - name: Verify Jest code cov
        uses: barecheck/code-coverage-action@v1
        with:
          barecheck-github-app-token: ${{ secrets.BARECHECK_GITHUB_APP_TOKEN }}
          lcov-file: "./feature-branch-fe-jest-code-cov/lcov.info"
          base-lcov-file: "./base-branch-fe-jest-code-cov/lcov.info"
          minimum-ratio: 1
          send-summary-comment: true
          show-annotations: "warning"
          app-name: React App | Jest test suite

  # code quality for the Django app
  get-base-branch-django-cov:
    needs: detect-changes
    if: needs.detect-changes.outputs.django == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
      - name: Get base commit SHA
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore cached base coverage
        id: cov-cache
        uses: actions/cache@v4
        with:
          path: ./src/django/coverage/django/coverage.lcov
          key: base-django-unittest-cov-${{ steps.base.outputs.sha }}
      - name: Create required env file
        if: steps.cov-cache.outputs.cache-hit != 'true'
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Build Django image
        if: steps.cov-cache.outputs.cache-hit != 'true'
        run: docker compose build
      - name: Run the unittest tests and generate code cov report
        if: steps.cov-cache.outputs.cache-hit != 'true'
        run: |
          docker compose \
            run --rm --entrypoint /bin/sh django \
            -c "coverage run --data-file=./coverage/django/.coverage manage.py test --no-input ./api/tests \
            && coverage lcov --data-file=./coverage/django/.coverage -o ./coverage/django/coverage.lcov \
            --include='./api/*' --omit='./api/migrations/*,./api/tests/*'"
      - name: Upload unittest code cov for the base branch
        uses: actions/upload-artifact@v4
        with:
          name: base-branch-django-unittest-code-cov
          path: ./src/django/coverage/django/coverage.lcov

  run-django-code-quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.django == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create required env file
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Build Django image
        run: docker compose build
      - name: Run the unittest tests and generate code cov report
        run: |
          docker compose \
            run --rm --entrypoint /bin/sh django \
            -c "coverage run --data-file=./coverage/django/.coverage manage.py test --no-input ./api/tests \
            && coverage lcov --data-file=./coverage/django/.coverage -o ./coverage/django/coverage.lcov \
            --include='./api/*' --omit='./api/migrations/*,./api/tests/*'"
      - name: Upload unittest code cov for the feature branch
        uses: actions/upload-artifact@v4
        with:
          name: feature-branch-django-unittest-code-cov
          path: ./src/django/coverage/django/coverage.lcov

  check-django-code-cov:
    needs:
      - detect-changes
      - get-base-branch-django-cov
      - run-django-code-quality
    if: needs.detect-changes.outputs.django == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Download unittest code cov reports
        uses: actions/download-artifact@v4
        with:
          pattern: "*-unittest-code-cov"
      - name: Verify unittest code cov
        uses: barecheck/code-coverage-action@v1
        with:
          barecheck-github-app-token: ${{ secrets.BARECHECK_GITHUB_APP_TOKEN }}
          lcov-file: "./feature-branch-django-unittest-code-cov/coverage.lcov"
          base-lcov-file: "./base-branch-django-unittest-code-cov/coverage.lcov"
          minimum-ratio: 1
          send-summary-comment: true
          show-annotations: "warning"
          app-name: Django App | Unittest test suite

  # code quality for the Countries
  get-base-branch-countries-cov:
    needs: detect-changes
    if: needs.detect-changes.outputs.countries == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
      - name: Get base commit SHA
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore cached base coverage
        id: cov-cache
        uses: actions/cache@v4
        with:
          path: ./src/django/coverage/countries/coverage.lcov
          key: base-countries-unittest-cov-${{ steps.base.outputs.sha }}
      - name: Create required env file
        if: steps.cov-cache.outputs.cache-hit != 'true'
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Build Django image
        if: steps.cov-cache.outputs.cache-hit != 'true'
        run: docker compose build
      - name: Run the unittest tests and generate code cov report
        if: steps.cov-cache.outputs.cache-hit != 'true'
        run: |
          docker compose \
              run --rm --entrypoint /bin/sh django \
              -c "coverage run --data-file=./coverage/countries/.coverage manage.py test --no-input ./countries/tests \
              && coverage lcov --data-file=./coverage/countries/.coverage -o ./coverage/countries/coverage.lcov \
              --include='./countries/*' --omit='./countries/tests/*'"
      - name: Upload unittest code cov for the base branch
        uses: actions/upload-artifact@v4
        with:
          name: base-branch-countries-unittest-code-cov
          path: ./src/django/coverage/countries/coverage.lcov

  run-countries-code-quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.countries == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create required env file
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Build Django image
        run: docker compose build
      - name: Run the unittest tests and generate code cov report
        run: |
          docker compose \
              run --rm --entrypoint /bin/sh django \
              -c "coverage run --data-file=./coverage/countries/.coverage manage.py test --no-input ./countries/tests \
              && coverage lcov --data-file=./coverage/countries/.coverage -o ./coverage/countries/coverage.lcov \
              --include='./countries/*' --omit='./countries/tests/*'"
      - name: Upload unittest code cov for the feature branch
        uses: actions/upload-artifact@v4
        with:
          name: feature-branch-countries-unittest-code-cov
          path: ./src/django/coverage/countries/coverage.lcov

  check-countries-code-cov:
    needs:
      - detect-changes
      - get-base-branch-countries-cov
      - run-countries-code-quality
    if: needs.detect-changes.outputs.countries == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Download unittest code cov reports
        uses: actions/download-artifact@v4
        with:
          pattern: "*-unittest-code-cov"
      - name: Verify unittest code cov
        uses: barecheck/code-coverage-action@v1
        with:
          barecheck-github-app-token: ${{ secrets.BARECHECK_GITHUB_APP_TOKEN }}
          lcov-file: "./feature-branch-countries-unittest-code-cov/coverage.lcov"
          base-lcov-file: "./base-branch-countries-unittest-code-cov/coverage.lcov"
          minimum-ratio: 1
          send-summary-comment: true
          show-annotations: "warning"
          app-name: Countries App | Unittest test suite

  # code quality for the Contricleaner
  get-base-branch-contricleaner-cov:
    needs: detect-changes
    if: needs.detect-changes.outputs.contricleaner == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
      - name: Get base commit SHA
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore cached base coverage
        id: cov-cache
        uses: actions/cache@v4
        with:
          path: ./src/django/coverage/contricleaner/coverage.lcov
          key: base-contricleaner-unittest-cov-${{ steps.base.outputs.sha }}
      - name: Create required env file
        if: steps.cov-cache.outputs.cache-hit != 'true'
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Build Django image
        if: steps.cov-cache.outputs.cache-hit != 'true'
        run: docker compose build
      - name: Run the unittest tests and generate code cov report
        if: steps.cov-cache.outputs.cache-hit != 'true'
        run: |
          docker compose \
              run --rm --entrypoint /bin/sh django \
              -c "coverage run --data-file=./coverage/contricleaner/.coverage manage.py test --no-input ./contricleaner/tests \
              && coverage lcov --data-file=./coverage/contricleaner/.coverage -o ./coverage/contricleaner/coverage.lcov \
              --include='./contricleaner/*' --omit='./contricleaner/tests/*'"
      - name: Upload unittest code cov for the base branch
        uses: actions/upload-artifact@v4
        with:
          name: base-branch-contricleaner-unittest-code-cov
          path: ./src/django/coverage/contricleaner/coverage.lcov

  run-contricleaner-code-quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.contricleaner == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create required env file
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Build Django image
        run: docker compose build
      - name: Run the unittest tests and generate code cov report
        run: |
          docker compose \
              run --rm --entrypoint /bin/sh django \
              -c "coverage run --data-file=./coverage/contricleaner/.coverage manage.py test --no-input ./contricleaner/tests \
              && coverage lcov --data-file=./coverage/contricleaner/.coverage -o ./coverage/contricleaner/coverage.lcov \
              --include='./contricleaner/*' --omit='./contricleaner/tests/*'"
      - name: Upload unittest code cov for the feature branch
        uses: actions/upload-artifact@v4
        with:
          name: feature-branch-contricleaner-unittest-code-cov
          path: ./src/django/coverage/contricleaner/coverage.lcov

  check-contricleaner-code-cov:
    needs:
      - detect-changes
      - get-base-branch-contricleaner-cov
      - run-contricleaner-code-quality
    if: needs.detect-changes.outputs.contricleaner == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Download unittest code cov reports
        uses: actions/download-artifact@v4
        with:
          pattern: "*-unittest-code-cov"
      - name: Verify unittest code cov
        uses: barecheck/code-coverage-action@v1
        with:
          barecheck-github-app-token: ${{ secrets.BARECHECK_GITHUB_APP_TOKEN }}
          lcov-file: "./feature-branch-contricleaner-unittest-code-cov/coverage.lcov"
          base-lcov-file: "./base-branch-contricleaner-unittest-code-cov/coverage.lcov"
          minimum-ratio: 1
          send-summary-comment: true
          show-annotations: "warning"
          app-name: Contricleaner App | Unittest test suite

  # code quality for the Dedupe Hub
  get-base-branch-dd-cov:
    needs: detect-changes
    if: needs.detect-changes.outputs.dedupe == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
      - name: Get base commit SHA
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore cached base coverage
        id: cov-cache
        uses: actions/cache@v4
        with:
          path: ./src/dedupe-hub/api/coverage/coverage.lcov
          key: base-dd-unittest-cov-${{ steps.base.outputs.sha }}
      - name: Create required env file
        if: steps.cov-cache.outputs.cache-hit != 'true'
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Build Dedupe Hub image
        if: steps.cov-cache.outputs.cache-hit != 'true'
        run: docker compose build
      - name: Run the unittest tests and generate code cov report
        if: steps.cov-cache.outputs.cache-hit != 'true'
        run: |
          docker compose \
              run --rm --entrypoint /bin/sh api-app \
              -c "coverage run --source=app --data-file=./coverage/.coverage -m unittest \
              && coverage lcov --data-file=./coverage/.coverage -o ./coverage/coverage.lcov \
              --include='./app/*' --omit='./tests/*, ./app/config.py'"
      - name: Upload unittest code cov for the base branch
        uses: actions/upload-artifact@v4
        with:
          name: base-branch-dd-unittest-code-cov
          path: ./src/dedupe-hub/api/coverage/coverage.lcov

  run-dd-code-quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.dedupe == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create required env file
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Build Dedupe Hub image
        run: docker compose build
      - name: Run the unittest tests and generate code cov report
        run: |
          docker compose \
              run --rm --entrypoint /bin/sh api-app \
              -c "coverage run --source=app --data-file=./coverage/.coverage -m unittest \
              && coverage lcov --data-file=./coverage/.coverage -o ./coverage/coverage.lcov \
              --include='./app/*' --omit='./tests/*, ./app/config.py'"
      - name: Upload unittest code cov for the feature branch
        uses: actions/upload-artifact@v4
        with:
          name: feature-branch-dd-unittest-code-cov
          path: ./src/dedupe-hub/api/coverage/coverage.lcov

  check-dd-code-cov:
    needs:
      - detect-changes
      - get-base-branch-dd-cov
      - run-dd-code-quality
    if: needs.detect-changes.outputs.dedupe == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Download unittest code cov reports
        uses: actions/download-artifact@v4
        with:
          pattern: "*-unittest-code-cov"
      - name: Verify unittest code cov
        uses: barecheck/code-coverage-action@v1
        with:
          barecheck-github-app-token: ${{ secrets.BARECHECK_GITHUB_APP_TOKEN }}
          lcov-file: "./feature-branch-dd-unittest-code-cov/coverage.lcov"
          base-lcov-file: "./base-branch-dd-unittest-code-cov/coverage.lcov"
          minimum-ratio: 1
          send-summary-comment: true
          show-annotations: "warning"
          app-name: Dedupe Hub App | Unittest test suite

  # code quality for ContriBot
  run-contribot-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.contribot == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ContriBot test dependencies
        run: |
          pip install --require-hashes --only-binary=:all: -r src/contribot/requirements-dev.txt
      - name: Run ContriBot unit tests
        run: |
          for testdir in src/contribot/*/tests; do
            (cd "$(dirname "$testdir")" && python -m pytest tests/)
          done

  # code quality integration test
  run-integration-test-code-quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.integration == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create required env file
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Build & Run OS Hub
        run: scripts/start_code_quality_dev
      - name: Waiting for all OS Hub services live processes completed
        run: sleep 60
      - name: Build Integration Test image
        run: docker compose -f docker-compose.tests.yml build
      - name: Run Integration Test
        run: |
          docker compose -f docker-compose.tests.yml \
              run --rm --entrypoint /bin/sh integration-test \
              -c "python -m unittest"
      - name: Run Playwright Test
        run: |
          docker compose -f docker-compose.tests.yml run --rm --build \
              --entrypoint "npx playwright test -c playwright.config.ts" \
              playwright-test

  # code quality formatting
  run-bash-script-linter:
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run the shellcheck linter check
        # Files only, and not recursively: `shellcheck scripts/*` fails
        # outright ("inappropriate type (is a directory)") as soon as any
        # subdirectory exists under scripts/, which has nothing to do with
        # the shell scripts being linted. Coverage is unchanged - every
        # script directly in scripts/ is still checked.
        run: find scripts -maxdepth 1 -type f -not -name '*.py' -exec shellcheck {} +
      - name: Run the shellcheck linter on script subdirectories
        run: find scripts -mindepth 2 -type f -name '*.sh' -exec shellcheck {} +
      - name: Check scripts are executable
        # A script committed without the executable bit fails with
        # "Permission denied" the first time something invokes it
        # directly instead of via `bash ./...` (#1221).
        run: |
          missing="$(find scripts -maxdepth 1 -type f ! -perm -u=x)"
          if [ -n "$missing" ]; then
            echo "These scripts are not executable (chmod +x and recommit):"
            echo "$missing"
            exit 1
          fi

  run-ops-script-linter:
    needs: detect-changes
    if: needs.detect-changes.outputs.ops_scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run the shellcheck linter on deployment scripts
        run: find deployment -maxdepth 1 -type f -not -name '*.tf' -exec shellcheck {} +
      - name: Run the shellcheck linter on ops tool scripts
        run: find src/kafka-tools src/anon-tools -type f -name '*.sh' -exec shellcheck --severity=warning {} +
      - name: Check deployment scripts are executable
        run: |
          missing="$(find deployment -maxdepth 1 -type f -not -name '*.tf' ! -perm -u=x)"
          if [ -n "$missing" ]; then
            echo "These scripts are not executable (chmod +x and recommit):"
            echo "$missing"
            exit 1
          fi

  run-terraform-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Terraform
        # v2.0.3, pinned by SHA (SonarCloud: external actions must pin a
        # full commit hash).
        uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1
        with:
          # Must match the version deploy_to_aws.yml runs.
          terraform_version: 1.13.3
      - name: Run terraform fmt -check and validate
        run: scripts/run_terraform_checks

  run-workflow-linter:
    needs: detect-changes
    if: needs.detect-changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run actionlint
        # -shellcheck= disables the embedded shellcheck pass: the older
        # workflows carry info-level quoting findings that would drown
        # the syntax/expression/action-version checks this job is for.
        run: docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint:1.7.8 -color -shellcheck=

  run-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run gitleaks
        # Scans the working tree on every PR regardless of the paths
        # changed. Known false positives are allowlisted in
        # .gitleaks.toml; see the public repository hygiene section of
        # AGENTS.md for what must never be committed.
        run: |
          docker run --rm -v "${PWD}:/repo" zricethezav/gitleaks:v8.30.1 \
              detect --source /repo --no-git --redact --config /repo/.gitleaks.toml

  run-migration-linter:
    needs: detect-changes
    if: needs.detect-changes.outputs.django_migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint new migrations for lock timeouts
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Plain assignment rather than process substitution so a git
          # failure fails the step instead of silently yielding no files.
          added_list="$(git diff --name-only --diff-filter=A \
              "origin/${BASE_REF}...HEAD" -- 'src/django/*/migrations/*.py')"
          if [ -z "$added_list" ]; then
            echo "No new migration files."
            exit 0
          fi
          mapfile -t added <<< "$added_list"
          scripts/lint_migrations.py "${added[@]}"

  check-migration-drift:
    needs: detect-changes
    if: needs.detect-changes.outputs.django_models == 'true'
    environment: Quality Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create required env file
        run: |
          echo '${{ secrets.CODE_QUALITY_ENV_FILE }}' > .env
      - name: Build Django image
        run: docker compose build
      - name: Check model state against the migration drift baseline
        run: scripts/check_migration_drift

  run-contribot-type-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.contribot == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ContriBot dependencies and pyright
        run: |
          pip install --require-hashes --only-binary=:all: -r src/contribot/requirements-dev.txt
          pip install --only-binary=:all: pyright==1.1.414
      - name: Run pyright with the error-count ratchet
        run: scripts/check_contribot_types

  run-flake8-linter:
    needs: detect-changes
    if: needs.detect-changes.outputs.django_lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flake8
        run: pip install $(grep -E '^(flake8|mccabe|pycodestyle|pyflakes)==' src/django/requirements.txt)
      - name: Run the Flake8 linter check
        working-directory: src/django
        run: flake8 --exclude 'settings.py,manage.py,*.pyc,api/migrations/*'

  run-eslint-linter-and-prettier-formatter:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: src/react/yarn.lock
      - name: Install frontend dependencies
        working-directory: src/react
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Run the ESLint linter check
        working-directory: src/react
        # Ratchet: the tree carries 49 react-hooks/exhaustive-deps
        # warnings, which never failed the build before this cap. New
        # warnings now fail. Lower the cap as warnings are fixed; never
        # raise it.
        run: ./node_modules/.bin/eslint src/ --ext .js --ext .jsx --max-warnings 49
      - name: Run the Prettier formatting check
        working-directory: src/react
        run: |
          yarn prettier \
            --config .prettierrc \
            --check 'src/**/*.js' 'src/**/*.jsx'
