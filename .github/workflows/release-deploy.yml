name: '[Release] Deploy'

on:
  workflow_dispatch:
    inputs:
      deploy-tag-version:
        description: 'Release/Tag version (e.g. 0.1.0)'
        required: true
        type: string
      deploy-env:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - sandbox
          - production
          - rba
        default: sandbox
      clear-opensearch-target:
        description: 'Which OpenSearch indexes and related templates to clear during deployment'
        required: false
        type: choice
        options:
          - none
          - production-locations
          - moderation-events
          - both
        default: none

jobs:
  create-release-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Create Release Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          custom_tag: ${{ github.event.inputs.deploy-env }}-${{ github.event.inputs.deploy-tag-version }}
          tag_prefix: ''
          github_token: ${{ secrets.GITHUB_TOKEN }}

  trigger-deploy-to-aws:
    runs-on: ubuntu-latest
    needs: create-release-tag
    permissions:
      actions: write
    steps:
      - name: Trigger Deploy to AWS workflow
        env:
          DEPLOY_ENV: ${{ github.event.inputs.deploy-env }}
          DEPLOY_TAG_VERSION: ${{ github.event.inputs.deploy-tag-version }}
          CLEAR_OPENSEARCH_TARGET: ${{ inputs.clear-opensearch-target }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$DEPLOY_ENV" = "production" ]]; then
            ENV="Production"
          elif [[ "$DEPLOY_ENV" = "rba" ]]; then
            ENV="RBA"
          else
            ENV="Staging"
          fi
          PAYLOAD=$(jq -n \
            --arg ref "${DEPLOY_ENV}-${DEPLOY_TAG_VERSION}" \
            --arg env "$ENV" \
            --arg clear "$CLEAR_OPENSEARCH_TARGET" \
            '{ref: $ref, inputs: {"deploy-env": $env, "clear-opensearch-target": $clear}}')
          curl --proto '=https' --tlsv1.2 -fsS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/opensupplyhub/open-supply-hub/actions/workflows/deploy_to_aws.yml/dispatches \
            -d "$PAYLOAD"
