name: 'Deploy to AWS'

on:
  push:
    branches:
      - main
      - 'releases/**'

  workflow_dispatch:
    inputs:
      deploy-env:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
        - Development
        - Test
        - Pre-prod
        - Staging
        - Production
        - RBA
        default: Development
      deploy-plan-only:
        description: 'Plan only'
        required: false
        type: boolean
        default: false
      restore-db:
        description: 'Restore database to original state (Reset database for Development and restore anon dump for Test and Pre-prod)'
        required: false
        type: boolean
        default: false
      clear-opensearch-target:
        description: 'Which OpenSearch indexes and related templates to clear during deployment (when Restore database to original state is enabled on Deploy to AWS, both are always cleared)'
        required: false
        type: choice
        options:
        - none
        - production-locations
        - moderation-events
        - both
        default: none

env:
  # Stop/clear/start Logstash when restore-db is enabled or a clear target is selected
  # (empty on push, "none" on manual dispatch default — both skip clearing).
  SHOULD_CLEAR_OPENSEARCH: ${{ inputs.restore-db == true || (inputs.clear-opensearch-target != '' && inputs.clear-opensearch-target != 'none') }}

jobs:
  check-base:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.basecheck.outputs.skip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get base branch of release
        id: basecheck
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger detected — setting skip to false"
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "Automatic trigger — running check_release_branch.sh"
            scripts/check_release_branch.sh
          fi

  init-and-plan:
    needs: [check-base]
    if: needs.check-base.outputs.skip == 'false'
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy-env || (github.ref_name == 'main' && 'Development') || (startsWith(github.ref_name, 'releases/') && 'Pre-prod') }}
    steps:
      - name: Get Environment Name for ${{ vars.ENV_NAME }}
        id: get_env_name
        uses: Entepotenz/change-string-case-action-min-dependencies@v1
        with:
          string: ${{ vars.ENV_NAME }}
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout config repository
        uses: actions/checkout@v4
        with:
          repository: 'opensupplyhub/ci-deployment'
          path: 'terraform-config'
          token: ${{ secrets.PAT }}
          persist-credentials: false

      - name: Copy tfvars for ${{ vars.ENV_NAME }}
        run: |
          cat "terraform-config/environments/${{ env.TFVAR_NAME }}"  "deployment/environments/${{env.TFVAR_NAME}}"  > "deployment/terraform/${{ env.SETTINGS_BUCKET }}.tfvars"
        env:
          SETTINGS_BUCKET: oshub-settings-${{ steps.get_env_name.outputs.lowercase }}
          TFVAR_NAME: terraform-${{steps.get_env_name.outputs.lowercase}}.tfvars

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - name: Validate whitelist and denylist usage
        run: |
          cat "terraform-config/environments/${{ env.TFVAR_NAME }}" "deployment/environments/${{ env.TFVAR_NAME }}" > "deployment/terraform/${{ env.SETTINGS_BUCKET }}.tfvars"
          scripts/validate_ip_lists.sh deployment/terraform/${{ env.SETTINGS_BUCKET }}.tfvars
        env:
          SETTINGS_BUCKET: oshub-settings-${{ steps.get_env_name.outputs.lowercase }}
          TFVAR_NAME: terraform-${{ steps.get_env_name.outputs.lowercase }}.tfvars

      - name: Terraform Plan for ${{ vars.ENV_NAME }}
        run: ./deployment/infra plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-west-1"
          SETTINGS_BUCKET: oshub-settings-${{ steps.get_env_name.outputs.lowercase }}

      - name: Save the log for debugging purposes ${{ vars.ENV_NAME }}
        if: always()
        run: |
          aws s3 cp "deployment/terraform/${{ env.SETTINGS_BUCKET }}.tfplan.log.txt" "s3://${{ env.SETTINGS_BUCKET }}/debug/${{ env.SETTINGS_BUCKET }}.tfplan.log.txt"
          rm -f "deployment/terraform/${{ env.SETTINGS_BUCKET }}.tfplan.log.txt"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SETTINGS_BUCKET: oshub-settings-${{ steps.get_env_name.outputs.lowercase }}
          AWS_DEFAULT_REGION: "eu-west-1"

      - name: Copy planfile to S3 bucket for ${{ vars.ENV_NAME }}
        run: |
          aws s3 cp "deployment/terraform/${{ env.SETTINGS_BUCKET }}.tfplan" "s3://${{ env.SETTINGS_BUCKET }}/terraform/${{ env.SETTINGS_BUCKET }}.tfplan"
          rm -f "deployment/terraform/${{ env.SETTINGS_BUCKET }}.tfplan"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SETTINGS_BUCKET: oshub-settings-${{ steps.get_env_name.outputs.lowercase }}
          AWS_DEFAULT_REGION: "eu-west-1"

  detach-waf-if-needed:
    needs: init-and-plan
    if: ${{ inputs.deploy-plan-only == false }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy-env || (github.ref_name == 'main' && 'Development') || (startsWith(github.ref_name, 'releases/') && 'Pre-prod') }}
    steps:
      - name: Get Environment Name for ${{ vars.ENV_NAME }}
        id: get_env_name
        uses: Entepotenz/change-string-case-action-min-dependencies@v1
        with:
          string: ${{ vars.ENV_NAME }}

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout config repository
        uses: actions/checkout@v4
        with:
          repository: 'opensupplyhub/ci-deployment'
          path: 'terraform-config'
          token: ${{ secrets.PAT }}
          persist-credentials: false

      - name: Copy tfvars for ${{ vars.ENV_NAME }}
        run: |
          cat "terraform-config/environments/${{ env.TFVAR_NAME }}"  "deployment/environments/${{ env.TFVAR_NAME }}" > "deployment/terraform/${{ env.SETTINGS_BUCKET }}.tfvars"
        env:
          SETTINGS_BUCKET: oshub-settings-${{ steps.get_env_name.outputs.lowercase }}
          TFVAR_NAME: terraform-${{ steps.get_env_name.outputs.lowercase }}.tfvars

      - name: Check whether AWS WAF enabled and find CloudFront distribution id
        run: |
          CLOUDFRONT_DISTRIBUTION_ID=$(./scripts/find_cloudfront_distribution_id.sh "$CLOUDFRONT_DOMAIN")
          waf_enabled=$(grep -E '^waf_enabled\s*=' deployment/environments/${{ env.TFVAR_NAME }} | awk '{print $3}')

          if [[ "$waf_enabled" == "false" && -n "$CLOUDFRONT_DISTRIBUTION_ID" ]]; then
            config=$(aws cloudfront get-distribution-config --id "$CLOUDFRONT_DISTRIBUTION_ID")
            etag=$(echo "$config" | jq -r '.ETag')
            dist=$(echo "$config" | jq '.DistributionConfig | .WebACLId = ""')

            echo "$dist" > updated_config.json

            aws cloudfront update-distribution \
              --id "$CLOUDFRONT_DISTRIBUTION_ID" \
              --if-match "$etag" \
              --distribution-config file://updated_config.json
          else
            echo "Skipping WAF detachment"
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-west-1"
          TFVAR_NAME: terraform-${{ steps.get_env_name.outputs.lowercase }}.tfvars
          SETTINGS_BUCKET: oshub-settings-${{ steps.get_env_name.outputs.lowercase }}
          CLOUDFRONT_DOMAIN: ${{ vars.CLOUDFRONT_DOMAIN }}

  apply:
    needs: [init-and-plan, detach-waf-if-needed]
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy-env || (github.ref_name == 'main' && 'Development') || (startsWith(github.ref_name, 'releases/') && 'Pre-prod') }}
    if: ${{ inputs.deploy-plan-only == false }}
    steps:
      - name: Get Environment Name for ${{ vars.ENV_NAME }}
        id: get_env_name
        uses: Entepotenz/change-string-case-action-min-dependencies@v1
        with:
          string: ${{ vars.ENV_NAME }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get planfile from S3 bucket for ${{ vars.ENV_NAME }}
        run: aws s3 cp "s3://${{ env.SETTINGS_BUCKET }}/terraform/${{ env.SETTINGS_BUCKET }}.tfplan" "deployment/terraform/${{ env.SETTINGS_BUCKET }}.tfplan"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SETTINGS_BUCKET: oshub-settings-${{ steps.get_env_name.outputs.lowercase }}
          AWS_DEFAULT_REGION: "eu-west-1"

      - name: Terraform Apply for ${{ vars.ENV_NAME }}
        run: |
          ./deployment/infra apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SETTINGS_BUCKET: oshub-settings-${{ steps.get_env_name.outputs.lowercase }}
          AWS_DEFAULT_REGION: "eu-west-1"

      # Preprod is ephemeral and shares Test's Chatbot Slack channel config. Attach
      # after apply so Chatbot creates a real SNS subscription (ARN-only updates
      # before the topic exists do not backfill). See doc/ops/monitoring.md.
      - name: Attach Preprod SNS topic to shared Chatbot config
        if: ${{ vars.ENV_NAME == 'Preprod' }}
        run: ./deployment/sync_chatbot_sns_topic attach
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-west-1"
          CHATBOT_CONFIGURATION_NAME: chatbotOpenSupplyHubTestGlobalAlarms
          SNS_TOPIC_NAME: topicOpenSupplyHubPreprodGlobalNotifications

      - name: Delete debug log from S3 bucket for ${{ vars.ENV_NAME }}
        if: always()
        continue-on-error: true
        run: aws s3 rm "s3://${{ env.SETTINGS_BUCKET }}/debug/${{ env.SETTINGS_BUCKET }}.tfplan.log.txt"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SETTINGS_BUCKET: oshub-settings-${{ steps.get_env_name.outputs.lowercase }}
          AWS_DEFAULT_REGION: "eu-west-1"

  build_and_push_react_app:
    needs: apply
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy-env || (github.ref_name == 'main' && 'Development') || (startsWith(github.ref_name, 'releases/') && 'Pre-prod') }}
    if: ${{ inputs.deploy-plan-only == false }}
    steps:
      - name: Get Environment Name for ${{ vars.ENV_NAME }}
        id: get_env_name
        uses: Entepotenz/change-string-case-action-min-dependencies@v1
        with:
          string: ${{ vars.ENV_NAME }}

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            src/react/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        working-directory: src/react
        run: yarn install

      - name: Build static assets
        working-directory: src/react
        run: yarn run build

      - id: project
        uses: Entepotenz/change-string-case-action-min-dependencies@v1
        with:
          string: ${{ vars.PROJECT }}

      - name: Move static
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          FRONTEND_BUCKET: ${{ steps.project.outputs.lowercase }}-${{ steps.get_env_name.outputs.lowercase }}-frontend
          AWS_DEFAULT_REGION: "eu-west-1"
          CLOUDFRONT_DOMAIN: ${{ vars.CLOUDFRONT_DOMAIN }}
        run: |
          CLOUDFRONT_DISTRIBUTION_ID=$(./scripts/find_cloudfront_distribution_id.sh "$CLOUDFRONT_DOMAIN")
          if [ -z "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            echo "Error: No CloudFront distribution found for domain: $CLOUDFRONT_DOMAIN"
            exit 1
          fi
          aws s3 sync src/react/build/ s3://$FRONTEND_BUCKET-$AWS_DEFAULT_REGION/ --delete
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"

  prepare_docker_image_builds:
    needs: build_and_push_react_app
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy-env || (github.ref_name == 'main' && 'Development') || (startsWith(github.ref_name, 'releases/') && 'Pre-prod') }}
    if: ${{ inputs.deploy-plan-only == false }}
    outputs:
      git_commit: ${{ steps.git_commit.outputs.git_commit }}
      env_slug: ${{ steps.get_env_name.outputs.lowercase }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_builds: ${{ steps.set-matrix.outputs.has_builds }}
    steps:
      - name: Get Environment Name for ${{ vars.ENV_NAME }}
        id: get_env_name
        uses: Entepotenz/change-string-case-action-min-dependencies@v1
        with:
          string: ${{ vars.ENV_NAME }}

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials for ${{ vars.ENV_NAME }}
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "eu-west-1"

      - name: Get GIT_COMMIT
        id: git_commit
        run: |
          export SHORT_SHA="$(git rev-parse --short HEAD)"
          export GIT_COMMIT_CI="${SHORT_SHA:0:7}"
          echo "git_commit=$GIT_COMMIT_CI" >> $GITHUB_OUTPUT

      - name: Build matrix of images to push
        id: set-matrix
        # ECR repos enforce IMMUTABLE tags and images are tagged by commit SHA, so
        # re-running this job on an unchanged commit (e.g. "Re-run failed jobs"
        # after a later step like terraform apply fails) would otherwise fail at
        # `docker push` with ImageTagAlreadyExistsException. Omit repos whose tag
        # already exists from the build matrix below.
        env:
          ENV_SLUG: ${{ steps.get_env_name.outputs.lowercase }}
          GIT_COMMIT: ${{ steps.git_commit.outputs.git_commit }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
        run: |
          set -euo pipefail

          images='[
            {"image":"kafka","context":"src/kafka-tools/","dockerfile":"src/kafka-tools/Dockerfile","repo_suffix":"-kafka","needs_batch_args":false},
            {"image":"django","context":"src/django","dockerfile":"src/django/Dockerfile","repo_suffix":"","needs_batch_args":false},
            {"image":"batch","context":"src/batch","dockerfile":"src/batch/Dockerfile","repo_suffix":"-batch","needs_batch_args":true},
            {"image":"dedupe","context":"src/dedupe-hub/api","dockerfile":"src/dedupe-hub/api/Dockerfile","repo_suffix":"-deduplicate","needs_batch_args":false},
            {"image":"logstash","context":"src/logstash","dockerfile":"src/logstash/Dockerfile","repo_suffix":"-logstash","needs_batch_args":false}
          ]'

          if [ "$ENV_SLUG" = "production" ]; then
            images=$(echo "$images" | jq -c '. + [{
              "image":"database-anonymizer",
              "context":"deployment/terraform/database_anonymizer_scheduled_task/docker",
              "dockerfile":"deployment/terraform/database_anonymizer_scheduled_task/docker/Dockerfile",
              "repo_suffix":"-database-anonymizer",
              "needs_batch_args":false
            }]')
          fi

          if [ "$ENV_SLUG" = "test" ]; then
            images=$(echo "$images" | jq -c '. + [{
              "image":"anonymized-database-dump",
              "context":"deployment/terraform/anonymized_database_dump_scheduled_task/docker",
              "dockerfile":"deployment/terraform/anonymized_database_dump_scheduled_task/docker/Dockerfile",
              "repo_suffix":"-anonymized-database-dump",
              "needs_batch_args":false
            }]')
          fi

          matrix='{"include":[]}'
          while IFS= read -r entry; do
            repo_suffix=$(echo "$entry" | jq -r '.repo_suffix')
            image=$(echo "$entry" | jq -r '.image')
            repo="${IMAGE_NAME}${repo_suffix}-${ENV_SLUG}"
            if aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=${GIT_COMMIT}" >/dev/null 2>&1; then
              echo "Tag ${GIT_COMMIT} already exists in ${repo}, skipping ${image}."
            else
              matrix=$(echo "$matrix" | jq -c --argjson entry "$entry" '.include += [$entry]')
            fi
          done < <(echo "$images" | jq -c '.[]')

          include_count=$(echo "$matrix" | jq '.include | length')
          if [ "$include_count" -gt 0 ]; then
            echo "has_builds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_builds=false" >> "$GITHUB_OUTPUT"
          fi
          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  build_and_push_docker_image:
    needs: prepare_docker_image_builds
    if: ${{ needs.prepare_docker_image_builds.outputs.has_builds == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy-env || (github.ref_name == 'main' && 'Development') || (startsWith(github.ref_name, 'releases/') && 'Pre-prod') }}
    strategy:
      fail-fast: false
      # Each matrix leg runs on its own runner (no shared CPU/disk). Cap at 4
      # concurrent legs to limit org-wide runner usage when deploy workflows overlap.
      max-parallel: 4
      matrix: ${{ fromJson(needs.prepare_docker_image_builds.outputs.matrix) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials for ${{ vars.ENV_NAME }}
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "eu-west-1"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push ${{ matrix.image }} Docker image to ECR for ${{ vars.ENV_NAME }}
        if: ${{ !matrix.needs_batch_args }}
        uses: docker/build-push-action@v2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/${{ vars.IMAGE_NAME }}${{ matrix.repo_suffix }}-${{ needs.prepare_docker_image_builds.outputs.env_slug }}:${{ needs.prepare_docker_image_builds.outputs.git_commit }}

      - name: Build and push ${{ matrix.image }} Docker image to ECR for ${{ vars.ENV_NAME }} (batch args)
        if: ${{ matrix.needs_batch_args }}
        uses: docker/build-push-action@v2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/${{ vars.IMAGE_NAME }}${{ matrix.repo_suffix }}-${{ needs.prepare_docker_image_builds.outputs.env_slug }}:${{ needs.prepare_docker_image_builds.outputs.git_commit }}
          build-args: |
            GIT_COMMIT=${{ needs.prepare_docker_image_builds.outputs.git_commit }}
            DOCKER_IMAGE=${{ vars.DOCKER_IMAGE }}
            ENVIRONMENT=${{ needs.prepare_docker_image_builds.outputs.env_slug }}

  create_kafka_topic:
    needs: [prepare_docker_image_builds, build_and_push_docker_image]
    if: ${{ always() && needs.prepare_docker_image_builds.result == 'success' && (needs.build_and_push_docker_image.result == 'success' || needs.build_and_push_docker_image.result == 'skipped') && inputs.deploy-plan-only == false }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy-env || (github.ref_name == 'main' && 'Development') || (startsWith(github.ref_name, 'releases/') && 'Pre-prod') }}
    steps:
      - name: Get Environment Name for ${{ vars.ENV_NAME }}
        id: get_env_name
        uses: Entepotenz/change-string-case-action-min-dependencies@v1
        with:
          string: ${{ vars.ENV_NAME }}
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create or update kafka topics for ${{ vars.ENV_NAME }}
        run: |
          ./deployment/run_kafka_task ${{ vars.ENV_NAME }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-west-1"

  stop_logstash:
    needs: create_kafka_topic
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy-env || (github.ref_name == 'main' && 'Development') || (startsWith(github.ref_name, 'releases/') && 'Pre-prod') }}
    if: ${{ inputs.deploy-plan-only == false }}
    steps:
      - name: Get Environment Name for ${{ vars.ENV_NAME }}
        id: get_env_name
        uses: Entepotenz/change-string-case-action-min-dependencies@v1
        with:
          string: ${{ vars.ENV_NAME }}
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Stop Logstash for ${{ vars.ENV_NAME }}
        if: ${{ env.SHOULD_CLEAR_OPENSEARCH == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-west-1"
        run: |
          aws \
              ecs update-service --desired-count 0 --cluster=ecsOpenSupplyHub${{vars.ENV_NAME}}Cluster \
              --service=OpenSupplyHub${{vars.ENV_NAME}}AppLogstash

  restore_database:
    needs: stop_logstash
    # Ephemeral GitHub Actions runner on AWS CodeBuild (Test account); the
    # project is managed by deployment/terraform/codebuild_github_runner.
    runs-on: codebuild-osh-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    environment: ${{ inputs.deploy-env || (github.ref_name == 'main' && 'Development') || (startsWith(github.ref_name, 'releases/') && 'Pre-prod') }}
    if:  ${{ inputs.deploy-plan-only == false }}
    steps:
      - name: Get Environment Name for ${{ vars.ENV_NAME }}
        id: get_env_name
        uses: Entepotenz/change-string-case-action-min-dependencies@v1
        with:
          string: ${{ vars.ENV_NAME }}
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Restore database for ${{ vars.ENV_NAME }}
        if: ${{ (vars.ENV_NAME == 'Preprod' || vars.ENV_NAME == 'Test') && inputs.restore-db == true}}
        run: |
          cd ./src/anon-tools
          mkdir -p ./keys
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ./keys/key
          docker build -t restore -f Dockerfile.restore .
          docker run -v ./keys/key:/keys/key --shm-size=2gb --rm \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e AWS_DEFAULT_REGION=eu-west-1 \
              -e ENVIRONMENT=${{ vars.ENV_NAME }} \
              -e DATABASE_NAME=opensupplyhub \
              -e DATABASE_USERNAME=opensupplyhub \
              -e DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
              restore
      - name: Reset database for ${{ vars.ENV_NAME }}
        if: ${{ vars.ENV_NAME == 'Development' && inputs.restore-db == true}}
        run: |
          echo "Creating an S3 folder with production location lists to reset DB if it doesn't exist."
          aws s3api put-object --bucket ${{ env.LIST_S3_BUCKET }} --key ${{ env.RESET_LISTS_FOLDER }}
          echo "Coping all production location files from the repo to S3 to ensure consistency between local and environment resets."
          aws s3 cp ./src/django/${{ env.RESET_LISTS_FOLDER }} s3://${{ env.LIST_S3_BUCKET }}/${{ env.RESET_LISTS_FOLDER }} --recursive
          echo "Triggering reset commands."
          ./deployment/run_cli_task ${{ vars.ENV_NAME }} "reset_database"
          ./deployment/run_cli_task ${{ vars.ENV_NAME }} "matchfixtures"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-west-1"
          LIST_S3_BUCKET: opensupplyhub-${{ steps.get_env_name.outputs.lowercase }}-files-eu-west-1
          RESET_LISTS_FOLDER: "api/fixtures/list_files/"

  post_deploy:
    needs: restore_database
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy-env || (github.ref_name == 'main' && 'Development') || (startsWith(github.ref_name, 'releases/') && 'Pre-prod') }}
    if: ${{ inputs.deploy-plan-only == false }}
    steps:
      - name: Get Environment Name for ${{ vars.ENV_NAME }}
        id: get_env_name
        uses: Entepotenz/change-string-case-action-min-dependencies@v1
        with:
          string: ${{ vars.ENV_NAME }}
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run migrations and other post-deployment tasks for ${{ vars.ENV_NAME }}
        run: |
          ./deployment/run_cli_task ${{ vars.ENV_NAME }} "post_deployment"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-west-1"

  clear_opensearch:
    needs: post_deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy-env || (github.ref_name == 'main' && 'Development') || (startsWith(github.ref_name, 'releases/') && 'Pre-prod') }}
    if: ${{ inputs.deploy-plan-only == false }}
    steps:
      - name: Get Environment Name for ${{ vars.ENV_NAME }}
        id: get_env_name
        uses: Entepotenz/change-string-case-action-min-dependencies@v1
        with:
          string: ${{ vars.ENV_NAME }}
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Get OpenSearch domain, filesystem and access point IDs for ${{ vars.ENV_NAME }}
        if: ${{ env.SHOULD_CLEAR_OPENSEARCH == 'true' }}
        id: export_variables
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-west-1"
        run: |
          OS_DOMAIN_NAME=$(echo "${{ vars.ENV_NAME }}-os-domain" | tr '[:upper:]' '[:lower:]')
          OPENSEARCH_DOMAIN=$(aws \
                       es describe-elasticsearch-domains --domain-names $OS_DOMAIN_NAME \
                       --query "DomainStatusList[].Endpoints.vpc" --output text)
          EFS_ID=$(aws \
                       efs describe-file-systems \
                       --query "FileSystems[?Tags[?Key=='Environment' && Value=='${{ vars.ENV_NAME }}'] && Tags[?Key=='Name' && Value=='efsAppLogstash']].FileSystemId" \
                       --output text)
          EFS_AP_ID=$(aws \
                          efs describe-access-points \
                          --query "AccessPoints[?FileSystemId=='$EFS_ID'].AccessPointId" \
                          --output text)
          echo "EFS_ID=$EFS_ID" >> $GITHUB_OUTPUT
          echo "EFS_AP_ID=$EFS_AP_ID" >> $GITHUB_OUTPUT
          echo "OPENSEARCH_DOMAIN=$OPENSEARCH_DOMAIN" >> $GITHUB_OUTPUT
      - name: Clear the custom OpenSearch indexes and templates for ${{ vars.ENV_NAME }}
        if: ${{ env.SHOULD_CLEAR_OPENSEARCH == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          OPENSEARCH_DOMAIN: ${{ steps.export_variables.outputs.OPENSEARCH_DOMAIN }}
          EFS_AP_ID: ${{ steps.export_variables.outputs.EFS_AP_ID }}
          EFS_ID: ${{ steps.export_variables.outputs.EFS_ID }}
          BASTION_IP: ${{ vars.BASTION_IP }}
        run: |
          if [ "${{ inputs.restore-db }}" = "true" ]; then
            CLEAR_OPENSEARCH_TARGET=both
          else
            CLEAR_OPENSEARCH_TARGET=${{ inputs.clear-opensearch-target }}
          fi
          export CLEAR_OPENSEARCH_TARGET
          cd ./deployment/clear_opensearch
          mkdir -p script
          mkdir -p ssh
          echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ssh/config
          printf "%s\n" "${{ secrets.SSH_PRIVATE_KEY }}" > ssh/id_rsa
          echo "" >> ssh/id_rsa
          echo -n ${{ vars.BASTION_IP }} > script/.env
          envsubst '${OPENSEARCH_DOMAIN} ${EFS_AP_ID} ${EFS_ID} ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} ${CLEAR_OPENSEARCH_TARGET}' \
            < clear_opensearch.sh.tpl > script/clear_opensearch.sh
          envsubst < run.sh.tpl > script/run.sh
          docker run --rm  \
              -v ./script:/script \
              -v ./ssh:/root/.ssh \
              kroniak/ssh-client bash /script/run.sh

  start_logstash:
    needs: clear_opensearch
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy-env || (github.ref_name == 'main' && 'Development') || (startsWith(github.ref_name, 'releases/') && 'Pre-prod') }}
    if: ${{ inputs.deploy-plan-only == false }}
    steps:
      - name: Get Environment Name for ${{ vars.ENV_NAME }}
        id: get_env_name
        uses: Entepotenz/change-string-case-action-min-dependencies@v1
        with:
          string: ${{ vars.ENV_NAME }}
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Start Logstash for ${{ vars.ENV_NAME }}
        if: ${{ env.SHOULD_CLEAR_OPENSEARCH == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-west-1"
        run: |
          aws \
              ecs update-service --desired-count 1 --cluster=ecsOpenSupplyHub${{vars.ENV_NAME}}Cluster \
              --service=OpenSupplyHub${{vars.ENV_NAME}}AppLogstash
